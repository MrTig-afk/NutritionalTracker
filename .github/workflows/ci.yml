# CI - the gate everything else keys off. No Claude, no tokens.
# Keep the workflow name "CI" and the job ids "ci" and "semgrep": branch
# protection requires both checks, and the review workflow triggers on
# workflow_run of the workflow named "CI".
#
# Lint / Test / Build below are this repo's real commands, verified locally
# 2026-08-20 before this file was written:
#   Lint  = frontend eslint            -> exit 0. (This line once said
#           "14 errors (pre-existing)". Those are fixed; re-measured
#           2026-08-20. A stale sign on a live gate is how a real
#           failure gets skimmed past - keep this line true.)
#   Test  = backend unittest, 23 tests -> passes (1 skipped: the live Gemini
#           call, gated behind NUTRI_LIVE, which needs a paid key)
#   Build = frontend vite build        -> passes
# The project block in CLAUDE.md still says "no test suite yet" and gives
# py_compile as the backend check. That is stale - backend/tests/ exists and
# runs - so the real suite is wired here instead.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # --- Python (backend/) ------------------------------------------------
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - name: Install backend
        run: |
          uv venv .venv --python 3.11
          uv pip install -r backend/requirements.txt

      # --- Node (frontend/) -------------------------------------------------
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci

      # --- The three commands ----------------------------------------------
      # `if: always()` on Test and Build is deliberate and STAYS - but not for
      # the reason first written here. That said "Lint is red today (14
      # pre-existing errors)"; lint is exit 0 now, so that justification is dead.
      # The flag is still load-bearing for the NEXT lint break: when Lint fails
      # on a PR, Test and Build still run, so ONE red cycle shows the whole
      # picture instead of three. That reason does not expire with the fix.
      # Sharp edge, left alone on purpose: always() is ALSO true when the run is
      # CANCELLED, so these steps execute on cancel and burn runner minutes.
      # `if: !cancelled()` is the tighter idiom - a behaviour change, own go.
      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        if: always()
        run: .venv/bin/python -m unittest discover -s backend/tests -t . -v

      - name: Build
        if: always()
        working-directory: frontend
        run: npm run build

  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Rulesets are PINNED, not `--config auto`. `auto` resolves the registry
      # at run time, so the rule set drifts underneath you: the same commit
      # scanned twice can give different results, and a green main can go red
      # overnight with no code change. That is disqualifying for a check that
      # branch protection requires - the gate must mean the same thing tomorrow
      # as it does today. Proven here on 2026-08-20: a local semgrep 1.173.0
      # run and this container's `auto` run returned different findings on the
      # identical tree.
      # Adding a ruleset is a deliberate edit to this line, and the PR that
      # does it shows exactly what new class of finding was turned on.
      - run: >
          semgrep scan --error
          --config p/python
          --config p/javascript
          --config p/secrets
