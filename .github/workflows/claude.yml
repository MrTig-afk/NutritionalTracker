# Responder - answers @claude mentions on issues and PR comments.
# Comment-only: it reads the repo and the thread, answers and proposes patches
# IN COMMENTS. It never edits files, never runs git, never pushes, so Claude
# never appears as a contributor. Auth is CLAUDE_CODE_OAUTH_TOKEN from
# `claude setup-token` (Pro profile), set by the owner via the secret-slot
# skill; never an API key.
#
# FORK PRs: this is a public repo, and a pull_request from a fork gets a
# read-only GITHUB_TOKEN and NO repository secrets. CLAUDE_CODE_OAUTH_TOKEN is
# therefore absent there and the responder cannot run - an @claude mention from
# an outside contributor does nothing. That is the accepted trade. The "fix"
# would be pull_request_target, which runs WITH secrets against untrusted fork
# code; that is a credential-theft primitive, not a feature, and is refused.
# CI and semgrep still run on fork PRs - they need no secrets.
#
# Action refs are pinned to 40-char commit SHAs, not tags: a tag can be
# silently repointed by its owner (the trivy-action and kics-github-action
# compromises did exactly that). semgrep enforces this in the CI workflow.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

jobs:
  respond:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read        # read only: the allowlist below forbids every write path anyway
      pull-requests: write  # post and update comments
      issues: write
      id-token: write       # required by the action
      actions: read         # lets it read CI results when asked "why is CI red"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@5ee796a55f92566ecd7e39d70dd613abcbea0d7c # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Pinned: cheap model, three turns, comment-only.
          # The action's tag mode allows file edits and git add/commit/push by
          # default; the deny list below switches all of that off. Deny rules
          # beat allow rules in Claude Code, so this holds even if the action
          # adds tools later.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 3
            --disallowedTools "Edit,MultiEdit,Write,NotebookEdit,Bash,mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files"
            --append-system-prompt "You answer in comments only. Never create, edit, commit or push files. When a code change is needed, propose it as a fenced diff in your comment and say the owner applies it. Keep answers short and plain."
